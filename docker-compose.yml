services:
  mysql:
    image: mysql:8.4
    container_name: credits-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: credits_root
      MYSQL_DATABASE: credits_platform
      MYSQL_USER: credits
      MYSQL_PASSWORD: credits
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucredits", "-pcredits"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
