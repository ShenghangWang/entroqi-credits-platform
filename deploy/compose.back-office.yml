# Optional staff-state overlay for the original Vue console bundled in Credits.
# Credentials/state never enter the image.
services:
  credits:
    environment:
      NODE_ENV: production
      CREDITS_CONSOLE_DIRECTORY: /app/back-office/dist
      CREDITS_CONSOLE_ORIGINS: ${CREDITS_CONSOLE_ORIGINS:?Set the exact HTTPS finance origin}
      CREDITS_PLATFORM_OPERATORS_FILE: /run/credits-staff/staff-operators.json
      CREDITS_PLATFORM_OPERATORS: '[]'
      CREDITS_PRICING_OPERATORS: '[]'
      CREDITS_AGENT_WORKFLOWS_ENABLED: ${CREDITS_AGENT_WORKFLOWS_ENABLED:-false}
      CREDITS_OWNER_RECOVERY_SECRET: ${CREDITS_OWNER_RECOVERY_SECRET:-}
      CREDITS_RECOVERY_MAIL_PROVIDER: resend
      CREDITS_RECOVERY_MAIL_FROM: ${CREDITS_RECOVERY_MAIL_FROM:-}
      CREDITS_RECOVERY_MAIL_API_KEY: ${CREDITS_RECOVERY_MAIL_API_KEY:-}
    volumes:
      # Recovery/rotation atomically replace files and append audit records.
      # Mount the owner-only directory, not a read-only individual JSON file.
      - type: bind
        source: ${CREDITS_STAFF_DIRECTORY:?Set the owner-only staff state directory}
        target: /run/credits-staff
