# Run on the same host as the simulation package; publish billing only on loopback.
services:
  credits:
    build: ..
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_DATABASE: entroqi_billing
      MYSQL_USER: credits
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique database password}
      CREDITS_SERVICE_CREDENTIALS: ${CREDITS_SERVICE_CREDENTIALS:?Set application credentials}
      CREDITS_PRICING_OPERATORS: ${CREDITS_PRICING_OPERATORS:-[]}
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      mysql: {condition: service_healthy}
    restart: unless-stopped
    networks: [billing]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: entroqi_billing
      MYSQL_USER: credits
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate root password}
    volumes: [billing-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u credits --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [billing]
networks:
  billing:
    internal: true
volumes:
  billing-data:
